[project]
name = "qquant-selfquant"
version = "0.1.0"
description = "Isolated environment for producing self-quantized checkpoints with llm-compressor."
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Pins per docs/specs/decision-log.md. llm-compressor's tight transformers<=5.10.1
# window is why this is a SEPARATE uv project from the root eval env.
# These are Linux + CUDA wheels; the lock is finalized on the vast.ai box (Spec 08).
dependencies = [
    "llmcompressor==0.12.0 ; sys_platform == 'linux'",
    "datasets>=4.8.4,<=5.0.0 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfquant"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
