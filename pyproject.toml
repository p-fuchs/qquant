[project]
name = "qquant"
version = "0.1.0"
description = "Quantization evaluation of Qwen2.5-7B-Instruct on a single RTX 4090 (vast.ai)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Hubert Michalski" },
    { name = "Przemysław Fuchs" },
]
# Torch-free core dependencies only. The GPU stack lives in the `gpu` group below.
# `vastai` is the cross-platform CLI the torch-free orchestrator shells out to (Spec 02);
# unit tests use a fake runner, but the real spike/run needs the `vastai` binary present.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "vastai>=1.1.1",
]

[project.scripts]
# Spec 01 owns the umbrella line; each later spec adds its own GPU-touching entry point
# (separate binaries so the torch-free umbrella `qquant` never imports torch).
# GPU-touching CLIs still reserved: qquant-eval, qquant-profile, qquant-orchestrate,
# qquant-aggregate, qquant-report (added by their own specs).
qquant = "qquant.cli:main"
qquant-spike = "qquant.orchestrate.spike:main"  # Spec 02
qquant-eval = "qquant.eval.cli:main"  # Spec 05
qquant-profile = "qquant.efficiency.cli:main"  # Spec 06

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qquant"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]
# Local analysis/plots (Spec 10). Cross-platform; not needed for the torch-free core.
analysis = ["pandas>=2.0", "numpy>=1.26", "matplotlib>=3.8"]
# GPU eval stack — installed only on the Linux vast.ai box (`uv sync --group gpu`).
# Pins per docs/specs/decision-log.md. NEVER add autoawq (archived; downgrades transformers).
gpu = [
    "torch>=2.8 ; sys_platform == 'linux'",
    # gptqmodel imports torchvision at model-load time but doesn't declare it (Spec 02 spike).
    "torchvision ; sys_platform == 'linux'",
    # gptqmodel JIT-compiles its sm_89 Marlin extension at first load; that needs ninja.
    "ninja ; sys_platform == 'linux'",
    "transformers==5.10.1 ; sys_platform == 'linux'",
    "gptqmodel==7.1.0 ; sys_platform == 'linux'",
    "optimum>=2.2.0 ; sys_platform == 'linux'",
    "bitsandbytes==0.49.2 ; sys_platform == 'linux'",
    "accelerate==1.13.0 ; sys_platform == 'linux'",
    "compressed-tensors>=0.17.1 ; sys_platform == 'linux'",
    "lm-eval[hf,ifeval,math]==0.4.12 ; sys_platform == 'linux'",
]

[tool.uv]
# Universal lock targets the two real platforms: the dev laptop and the vast.ai box.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA GPU; run on the vast.ai box (auto-skipped without CUDA)",
]
