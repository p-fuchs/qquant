name: ci

on:
  push:
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync torch-free core + dev tools
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: torch-free import guard
        run: uv run python -c "import qquant, qquant.orchestrate.vastai, qquant.orchestrate.spike, sys; assert 'torch' not in sys.modules, sorted(m for m in sys.modules if m.startswith('torch'))"
